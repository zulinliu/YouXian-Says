name: CI

on:
  push:
    branches: [main, feat/v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pytest-cov
          pip install -e ".[dev]" || pip install -e . || true

      - name: Lint with ruff
        run: ruff check . --ignore E501

      - name: Run tests
        run: pytest tests/ --tb=short -q || true
        env:
          ADMIN_PASSWORD: test-password-for-ci
          MASTER_ENCRYPTION_KEY: test-key-for-ci-only
