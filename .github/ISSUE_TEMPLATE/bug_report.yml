name: Bug 报告
description: 报告一个问题以帮助我们改进
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间填写这个 Bug 报告！请尽量提供详细信息。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰描述遇到了什么问题
      placeholder: 例如：在选题共创页面点击"生成选题"后，页面返回 500 错误
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 详细描述如何复现这个问题
      placeholder: |
        1. 打开 Web 后台
        2. 进入"选题共创"页面
        3. 输入话题关键词
        4. 点击"生成选题"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 描述你期望发生的行为
      placeholder: 应该成功生成 3-5 个选题建议
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 描述实际发生了什么
      placeholder: 页面显示 500 Internal Server Error

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 粘贴相关的错误日志或截图
      render: shell

  - type: input
    id: version
    attributes:
      label: 项目版本
      description: 你使用的是哪个版本？
      placeholder: v1.0.0

  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - 本地开发 (streamlit run)
        - Docker 容器
        - 云服务器部署
        - 其他
    validations:
      required: true
