name: 功能请求
description: 提出一个新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请详细描述你的需求。

  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 描述是什么问题或场景触发了这个需求
      placeholder: |
        作为一个视频创作者，我经常需要批量处理多个选题...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 描述你希望如何解决这个问题或实现这个功能
      placeholder: |
        希望能在选题共创页面增加"批量生成"按钮，一次生成多个选题...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 描述你考虑过的替代方案
      placeholder: 目前只能逐个手动生成，效率较低

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 这个功能对你有多重要？
      options:
        - 高 - 严重影响使用体验
        - 中 - 有则更好，无则不便
        - 低 - 锦上添花
    validations:
      required: true
